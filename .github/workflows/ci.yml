name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.9.9
      - name: Run ruff
        run: ruff check flowconx scripts tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # Scoped to the data, feature, config and metric layers -- see the
      # rationale in pyproject.toml.
      - name: Run mypy
        run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall flowconx scripts
      - name: Import check
        run: python -c "from flowconx import config, datasets, features, labels, losses, memory, metrics, model, schema, evaluate, train, eval_cli"
      # The leakage tests are the gate. A split that stops being a partition,
      # a feature family that starts exposing an identifier, or a split
      # protocol that silently degrades instead of raising, fails the build.
      - name: Leakage and metric tests
        run: python -m pytest tests/ -q

  audit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      # The paper source is checked like code: missing \input targets,
      # unbalanced environments, undefined refs and citations, and generated
      # tables containing TODO cells. Every table is now fully populated, so
      # this runs without --allow-todo: a TODO cell reaching the paper fails
      # the build, because it would mean a cited number does not exist.
      - name: Check paper source
        run: python scripts/check_paper.py

      # End-to-end audit run on a generated table with the canonical schema.
      # The 87 MB training CSV is not committed, so CI cannot audit it; this
      # asserts the pipeline itself still runs and writes its artifacts.
      - name: Audit smoke run
        run: python scripts/audit_smoke.py

      # The full pipeline on generated data: no download, ~2 minutes on CPU.
      # Catches breakage that unit tests cannot -- a split protocol that
      # silently became unreachable, an evaluation mode that stopped running,
      # provenance that stopped being recorded.
      - name: Verify pipeline end to end
        run: python scripts/verify_pipeline.py
