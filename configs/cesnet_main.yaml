defaults: [base.yaml]
name: flowconx_main
description: >
  Headline configuration on CESNET-QUIC22. Session-disjoint splitting, so that
  flows from one capture day never straddle train and test. The random-flow
  contrast is a separate config, reported as a column, never as the headline.
data:
  dataset: cesnet_quic22
  csv: data/processed/cesnet_quic22.csv
  split_protocol: session_disjoint
  max_packets: 30
train:
  # 15 epochs at batch 512 rather than 20 at 256. Measured on this hardware,
  # a step costs about the same at either batch size, so the larger batch
  # halves wall-clock per epoch; larger batches also help a contrastive
  # objective, which sees more negatives per step. Early stopping on the
  # prototype head usually triggers before epoch 15.
  epochs: 15
  stage1_epochs: 7
  batch_size: 512
  early_stop_patience: 4
eval:
  classifier_heads: [knn, prototype, linear]
  probes: true
  early_classification: true
