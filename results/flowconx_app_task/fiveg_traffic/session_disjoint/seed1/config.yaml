name: flowconx_app_task
description: 'The same architecture, the same split, the same budget -- classifying
  the application instead of the service category.

  This exists because the enrollment result forced the question. On the identical
  frozen embedding, with identical k and procedure, prototype enrollment reaches macro-F1
  0.7378 identifying the application from a single labelled flow and 0.4234 for the
  service category. That is not a small difference in difficulty; it says the embedding
  encodes application identity and does not encode the service taxonomy it is being
  scored against.

  The 5G service taxonomy is the dataset''s own directory structure, and it groups
  applications that behave nothing alike: `metaverse` is Zepeto and Roblox, `game_streaming`
  is GeForce Now and KT GameBox. A model that fingerprints applications well will
  look bad on it, and a coarse volume statistic that captures "bursty and small-packet"
  will look good -- which is exactly the pattern in the headline table, where XGBoost
  on thirteen flow scalars beats us by 0.25.

  If this run scores well, the paper''s task should change and the service results
  become a documented negative. If it does not, the architecture has a problem that
  reframing will not fix. Either answer is worth one run.

  Note that 15 applications with `min_class_count: 100` includes apps whose captures
  land entirely in test under session-disjoint splitting (roblox has one capture file).
  Those are unpredictable by construction and will drag macro-F1 down; the per-class
  table in the result JSON separates them out.

  '
seed: 1
output_root: results
data:
  dataset: fiveg_traffic
  csv: data/processed/fiveg_traffic.csv
  label_column: app
  split_protocol: session_disjoint
  split_seed: 42
  val_fraction: 0.1
  test_fraction: 0.2
  rare_class_mode: drop
  min_class_count: 200
  max_packets: 32
  observed_packets: null
  limit: null
  subsample_rows: null
  unknown_apps: []
model:
  app_hidden_dim: 192
  net_hidden_dim: 128
  app_emb_dim: 256
  net_emb_dim: 128
  flow_emb_dim: 256
  dropout: 0.1
  n_conv_blocks: 3
  n_heads: 6
  n_transformer_layers: 1
  dual_encoder: true
  fusion: cross_attention
  adversarial_head: true
  classify_from: z_flow
  width_multiplier: 1.0
loss:
  temperature: 0.07
  lambda_service_supcon: 1.0
  lambda_flow_supcon: 1.0
  lambda_app_supcon: 0.0
  lambda_prototype: 0.1
  lambda_disentangle: 0.25
  lambda_adversarial: 0.15
  lambda_pair_margin: 0.0
  lambda_flow_pair_margin: 1.0
  pair_negative_margin: 0.2
  pair_positive_target: 0.75
  grl_warmup_epochs: 5
train:
  epochs: 15
  batch_size: 512
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  schedule: two_stage
  stage1_epochs: 7
  memory_per_class: 512
  num_workers: 0
  device: auto
  early_stop_patience: 4
  amp: false
eval:
  knn_k: 5
  classifier_heads:
  - knn
  - prototype
  - linear
  max_reference_rows: 20000
  bootstrap_resamples: 1000
  open_set: false
  few_shot: true
  few_shot_k:
  - 1
  - 5
  - 10
  - 25
  - 50
  - 100
  drift: false
  robustness: false
  early_classification: false
  early_packet_budgets:
  - 1
  - 2
  - 3
  - 5
  - 10
  - 20
  cost: true
  probes: false
